<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflect</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 1.2em;
            color: #666;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .text-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            height: 30%;
            max-width: 600px;
        }

        textarea{
            width: 80%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Reflection Page</h1>
    <h2> What are your thoughts about the app so far?</h2>
    <div class="text-box">
        <p>Last Redirect Time:</p>
        <textarea id = "feedback" rows="4" cols="50">
On a scale of 1-10 rate the following:
Are you using distracting websites less?
- 
Do you just turn off the extension or unblacklist websites?
- 
        </textarea>
    </div>
    <button id="updateButton">Update Time</button>
    <button id="saveFormData">Save Data</button>
    <script src="./reflect.js"></script>
</body>
</html>

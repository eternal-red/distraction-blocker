<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Distraction Blocker</title>
  <link rel="stylesheet" type="text/css" href="./popup.css" media="screen" />
  <link href="https://fonts.googleapis.com/css2?family=YourSelectedFont&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>
<body>
  <!-- Header Section (moved below the password section) -->
  <header id="header-extension">
    <h1 class="header">Distraction Blocker</h1>
</header>
  <div id="app">
    <div id="content-container">
      

      <!-- Unlock Editing Section -->
      <section class="password-section">
        <h2>Enter Password to Edit List</h2>
        <input type="password" id="passwordInput" placeholder="Enter password">
        <button id="unlockButton">Unlock</button>
      </section>

      <!-- Focus slider -->
      <section class="focus-section">
        <h2>Focus Mode</h2>
        <label class="switch">
          <input type="checkbox" id="focusSlider">
          <span class="slider"></span>
        </label>
      </section>

      
      
      <!-- Add website manually -->
      <section class="add-block">
        <h2>Add to Block List</h2>
        <div class="main">
          <input type="text" id="websiteInput" placeholder="Enter website URL">
          <button class="block" id="blockButton">Block</button>
        </div>
        <button class="block" id="blockCurrentSiteButton">Block Current Path</button> 
      </section>

      <!-- Display blocked sites -->
      <section class="remove-block">
        <h2>Blocked Websites</h2>
        <div class="main">
          <div id="blockedWebsitesDiv"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="./popup.js"></script>
</body>
</html>

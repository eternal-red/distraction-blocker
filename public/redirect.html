<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Redirect</title>
    <link rel="stylesheet" href="redirect.css">
</head>
<body>
    <div class="header">
        <h1>404 <br><span>Site not Found</span></h1>
        <p>Consider this a sign from the universe to get some work done!</p>
    </div>

    <div class="container">
        <!-- Assignments Section -->
        <div class="assignments">
            <!-- Upcoming Assignments Card -->
            <div class="assignment upcoming-card">
                <h2>Upcoming Assignments</h2>
            </div>
            <div class="assignment" data-template style="display: none;">
                <a href="#" target="_blank">
                    <p class="class-name"></p>
                    <h3></h3>
                    <p class="due-date"></p>
                </a>
            </div>
        </div>

        <!-- To-Do List -->
        <div class="todo-list">
            <div class="task" data-template style="display: none;">
                <input type="checkbox">
                <div class="task-content">
                    <a href="#" target="_blank">
                        <h3></h3>
                        <p class="due-date"></p>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="redirect.js"></script>
</body>
</html>
